healthCheckTimeout: 1800
logLevel: debug
logToStdout: "both"
metricsMaxInMemory: 1000
sendLoadingState: true
includeAliasesInList: true

macros:
  "llama-cmd": >
    /app/llama-server
    --port 9999
    --parallel 1
    --webui llamacpp
    --jinja
    --ctx-checkpoints 8
    --ctx-checkpoints-interval 8192
    --merge-qkv
    -ngl 999 --threads-batch 1
    --recurrent-ckpt-mode auto
    --chat-template-file /models/qwen3.6-27b-gguf/chat_template-v19.jinja
    --reasoning-format deepseek
    --reasoning-budget 16384

models:
  "qwen3.6-27b":
    proxy: "http://127.0.0.1:9999"
    cmd: |
      ${llama-cmd}
      --model /models/qwen3.6-27b-gguf/ubergarm-iq4ks/Qwen3.6-27B-MTP-IQ4_KS.gguf
      --mmproj /models/qwen3.6-27b-gguf/mmproj-F16.gguf
      --ctx-size 160000
      -ctk q8_0 -ctv q8_0
    ttl: 3600
    filters:
      # Baseline sampling params (thinking mode, general tasks)
      setParams:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0

      setParamsByID:
        # Thinking mode, precise coding tasks (WebDev, code generation)
        "${MODEL_ID}:code":
          temperature: 0.6
          parallel_tool_calls: true
          chat_template_kwargs:
            preserve_thinking: true

        # Instruct (non-thinking) mode — general tasks, fast conversational responses
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

  "qwen3.6-27b-mtp":
    proxy: "http://127.0.0.1:9999"
    cmd: |
      ${llama-cmd}
      --model /models/qwen3.6-27b-gguf/ubergarm-iq4ks/Qwen3.6-27B-MTP-IQ4_KS.gguf
      --ctx-size 160000
      -ctk q8_0 -ctv q8_0
      -mtp
      # https://github.com/ikawrakow/ik_llama.cpp/pull/1780
      --draft-max 4
      --draft-p-min 0
    ttl: 3600
    filters:
      # Baseline sampling params (thinking mode, general tasks)
      setParams:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0

      setParamsByID:
        # Thinking mode, precise coding tasks (WebDev, code generation)
        "${MODEL_ID}:code":
          temperature: 0.6
          parallel_tool_calls: true
          chat_template_kwargs:
            preserve_thinking: true

        # Instruct (non-thinking) mode — general tasks, fast conversational responses
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

        # Instruct (non-thinking) mode — structured reasoning (math, logic, step-by-step)
        "${MODEL_ID}:reason":
          temperature: 1.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

