services:
  ik-llama-cpp-qwen36-27b:
    image: ghcr.io/ikawrakow/ik-llama-cpp:cu13-server-4520
    container_name: ik-llama-cpp-qwen36-27b
    restart: unless-stopped
    ports:
      - "${PORT:-8020}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../models-cache}:/models:ro"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # DISABLE_THINKING=1 (default) appends --chat-template-kwargs to disable
        # Qwen3 thinking server-side. Forces the chat template to insert empty
        # <think></think> blocks → output goes straight to the response. Useful for
        # clients (e.g. opencode) that display <think> content as the response.
        # Tradeoff: applies to ALL clients on this server instance — Hermes/agents that
        # use thinking lose reasoning capability. See docs/HARDWARE.md and disc club-3090#97.
        # Note: $$VAR is YAML-escape for $VAR (compose passes literal $ to bash).
        EXTRA_ARGS=()
        if [ "${DISABLE_THINKING:-1}" = "1" ]; then
          EXTRA_ARGS+=("--chat-template-kwargs" '{"enable_thinking":false}')
          echo "[entrypoint] DISABLE_THINKING=1 — chat template will produce empty <think></think>"
        fi
        if [ "${PRESERVE_THINKING:-0}" = "1" ]; then
          EXTRA_ARGS+=("--chat-template-kwargs" '{"preserve_thinking":true}')
          echo "[entrypoint] PRESERVE_THINKING=1 — thinking content from all preceding turns is preserved in messages"
        fi
        exec /app/llama-server "$$@" "$${EXTRA_ARGS[@]}"
      - --
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/${GGUF_FILE:-qwen3.6-27b-gguf/ubergarm-iq4ks/Qwen3.6-27B-MTP-IQ4_KS.gguf}
      - --mmproj
      - /models/${MMPROJ_FILE:-qwen3.6-27b-gguf/mmproj-F16.gguf}
      - -ngl
      - "99"
      - -c
      - "122880"
      - -ngld
      - "99"
      - -cd
      - "4096"
      - --multi-token-prediction
      - --draft-max
      - "2"
      - --draft-p-min
      - "0.0"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --merge-qkv
      - --merge-up-gate-experts
      - --ctx-checkpoints
      - "32"
      - --parallel-tool-calls
      - -khad
      - --split-mode
      - none 
      - --main-gpu
      - "0"
      - --image-min-tokens
      - "1024"
      - --threads
      - "6"
      - --threads-batch
      - "6"
      - --flash-attn
      - on
      - --parallel
      - "1"
      - --batch-size
      - "512"
      - --ubatch-size
      - "512"
      - --no-mmap
      - --jinja

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CUDA_VISIBLE_DEVICES:-0}"]
              capabilities: [compute, utility]




